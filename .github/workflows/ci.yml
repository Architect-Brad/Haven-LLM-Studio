name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npx eslint src/ --ext .ts,.tsx || true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npx vitest run --reporter=verbose
      - run: npx vitest run --coverage || true
      - run: npx vitest run --reporter=verbose --config vitest.e2e.config.ts || echo 'E2E skipped (requires running server)'

  build-native:
    name: Build Native Core (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Build core
        run: |
          cmake -B native/build -DCMAKE_BUILD_TYPE=Release native/
          cmake --build native/build --config Release -j$(nproc)

      - name: Build CLI
        run: |
          cmake --build native/build --target haven-cli --config Release -j$(nproc)

      - name: Build N-API addon
        run: |
          npm ci --ignore-scripts
          cd native && node-gyp rebuild 2>/dev/null || true

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-build
          path: |
            native/build/
          retention-days: 3

  build-macos:
    name: Build Native Core (macOS)
    runs-on: macos-latest
    if: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build with Metal
        run: |
          cmake -B native/build -DCMAKE_BUILD_TYPE=Release -DHAVEN_METAL_SUPPORT=ON native/
          cmake --build native/build --config Release -j$(sysctl -n hw.logicalcpu)

  smoke-test:
    name: Smoke Test
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npx tsc -p tsconfig.server.json

      - name: Start server & smoke test
        run: |
          node dist/server/index.js &
          SERVER_PID=$!
          sleep 2
          ./smoke-test.sh || true
          npx vitest run --reporter=verbose --config vitest.e2e.config.ts 2>/dev/null || echo 'E2E tests skipped'
          kill $SERVER_PID 2>/dev/null || true
